name: CI Pipeline Football News

on:
  push:
    # On ajoute ta branche de travail pour tester immédiatement
    branches: [ "main", "refactor-backend" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Étape 1 : Tests Unitaires (Backend Python)
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9' # Cohérent avec le Dockerfile
          
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          
      - name: Run Backend Tests
        run: |
          cd backend
          pytest

  # Étape 2 : Build et Push des images Docker
  build-and-push:
    needs: test-backend
    # On ne lance le build/push que si les tests sont passés
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build Backend (Python)
      - name: Build and push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/foot-backend:latest

      # Build Frontend (React)
      - name: Build and push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          # J'ai passé le tag à 'latest' pour simplifier la gestion dans Kubernetes
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/foot-frontend:v5.4