server {
    listen 80;
    
    # Racine du serveur web
    root /usr/share/nginx/html;
    index index.html;

    # Gestion des fichiers statiques (optimisation cache)
    location /static/ {
        expires 1y;
        add_header Cache-Control "public";
    }

    # IMPORTANT : Redirection vers index.html pour le routing React
    # Si le fichier demandé n'existe pas, on renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}