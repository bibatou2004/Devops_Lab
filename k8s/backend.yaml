apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        # REMPLACE PAR TON IMAGE DOCKER HUB
        image: noun25/foot-backend:latest
        env:
        - name: DATABASE_URL
          value: "postgresql://postgres:footsecret@postgres:5432/footnews"
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - port: 3000
      targetPort: 3000