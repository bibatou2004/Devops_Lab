# k8s/backend.yaml (CORRIGÉ)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: noun25/foot-backend:latest
        imagePullPolicy: Always # Force le retéléchargement de l'image si mise à jour
        env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: foot-secrets
              key: postgres-user
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: foot-secrets
              key: postgres-password
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: foot-secrets
              key: postgres-db
        - name: DB_HOST
          value: "postgres" # Nom du service K8s
        # Reconstitution de l'URL pour ton application Node (si elle attend une URL complète)
        # Note : Il faudra peut-être adapter ton code JS pour lire ces variables séparées, 
        # ou construire la string ici :
        - name: DATABASE_URL
          value: "postgresql://$(DB_USER):$(DB_PASS)@postgres:5432/$(DB_NAME)"
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30001 # On fixe un port pour faciliter les tests locaux