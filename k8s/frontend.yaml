apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: noun25/foot-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80 # Nginx écoute sur le 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30002 # <--- PORT FIXE ACCESSIBLE DEPUIS TON NAVIGATEUR